<section class="schedule-section spad pt-4">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="section-title">
                    <h2>Upcoming Events</h2>
                    <p>browse various ongoing events</p>
                </div>
            </div>
        </div>
        <div class="row">
            @for(event of eventList;track $index){
            <div class="col-3 p-2">
                <div class="card">
                    <img class="card-img-top" [src]="event.imageUrl?event.imageUrl:'assets/4111006.jpg'"
                        alt="Card image cap" (error)="event.imageUrl = 'assets/4111006.jpg'">
                    <div class="card-body">
                        <h5 class="card-title">{{event.eventName}}</h5>
                        <a [routerLink]="['/event',event.eventId]" class="btn btn-primary">Book</a>
                    </div>
                </div>
            </div>
            }
        </div>

    </div>
</section>
